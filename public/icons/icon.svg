<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant Emerald / Lime Gradient for Checkmark & Knight -->
    <linearGradient id="cm-green-grad" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="55%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Warm Royal Amber / Gold Gradient for Crown -->
    <linearGradient id="cm-crown-grad" x1="45" y1="8" x2="65" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Subtle Drop Glow -->
    <filter id="cm-glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#22c55e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Group with Filter -->
  <g filter="url(#cm-glow)">
    <!-- 1. The Crown (Mounted above Knight's head, rounded peaks with pearls) -->
    <path
      d="M44 26 L42 16 L49 20 L56 12 L63 20 L70 16 L68 26 Z"
      fill="url(#cm-crown-grad)"
      stroke="url(#cm-crown-grad)"
      stroke-width="1.5"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <!-- Crown Pearls -->
    <circle cx="42" cy="15" r="2.2" fill="#fef08a" />
    <circle cx="56" cy="11" r="2.6" fill="#fef08a" />
    <circle cx="70" cy="15" r="2.2" fill="#fef08a" />

    <!-- 2. The Checkmark + Knight Head Flow -->
    <!-- Starting at left check wing, diving to vertex, rising smoothly into arched mane & knight head -->
    <path
      d="M18 48 
         L28 62 
         C33 52 41 38 52 28 
         C56 24 64 24 68 28
         C70 30 71 33 72 36
         L66 38
         C65 38 64 39 65 41
         L69 44
         C66 48 61 49 57 48
         C53 47 50 51 52 57
         C54 62 60 64 68 64"
      fill="none"
      stroke="url(#cm-green-grad)"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 3. Knight Eye & Ear Accent -->
    <path
      d="M60 32 C61 31 63 31 64 33"
      stroke="#ffffff"
      stroke-width="2.5"
      stroke-linecap="round"
    />

    <!-- 4. Inner White Chest Contour (Sleek aerodynamic inner curve) -->
    <path
      d="M36 66 C36 57 40 46 44 40"
      stroke="#ffffff"
      stroke-width="5"
      stroke-linecap="round"
    />

    <!-- 5. Terminal Base Sphere / Pearl -->
    <circle cx="73" cy="64" r="4.5" fill="#22c55e" />
    <circle cx="72" cy="63" r="1.5" fill="#bbf7d0" />
  </g>
</svg>
